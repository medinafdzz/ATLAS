[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-infrastructure"
version = "0.1.0"
description = "Read-only infrastructure inventory, drift and readiness"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["fastapi>=0.100,<1", "uvicorn>=0.22,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
atlas = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
